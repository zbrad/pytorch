# tuned/devices/gb10.conf — static device config for GB10 (DGX Spark,
# Grace Blackwell, aarch64). See tuned/devices/rtx50.conf for the
# 12.1a/12.0a family-specific-suffix rationale.

GPU_TUNED_VARIANT="gb10"
GPU_TUNED_PLATFORM="aarch64"
GPU_TUNED_TORCH_ARCH="12.1a"
GPU_TUNED_HW_LABEL="GB10 / DGX Spark (Grace Blackwell, SM 121)"

# GB10's Grace CPU (Cortex-X925/A725) has no SME/SME2 -- this is the whole
# reason CMakeLists.txt's USE_KLEIDIAI_SME option exists (added on this
# branch). rtx40/rtx50 don't need this set at all: KleidiAI itself is
# already gated off entirely on x86_64
# (cmake_dependent_option(USE_KLEIDIAI ... "CPU_AARCH64" OFF)), so there's
# nothing to override there.
GPU_TUNED_USE_KLEIDIAI_SME="0"
