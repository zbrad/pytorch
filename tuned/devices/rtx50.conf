# tuned/devices/rtx50.conf — static device config for RTX 50 (Blackwell
# consumer, x86_64).
#
# "a" suffix targets the Blackwell family-specific SASS variant -- required
# for RTX 50-specific tensor core instructions not present in the
# compatible/generic sm_120 target (same rationale as GB10's 12.1a, and
# matching the same convention already used in zbrad/vllm and
# zbrad/flashinfer's own tuned/devices/rtx50.conf). Confirmed pytorch's own
# arch-list parser (cmake/Modules_CUDA_fix/upstream/FindCUDA/
# select_compute_arch.cmake) accepts this suffix directly
# (regex "[0-9()]+[af]?").

GPU_TUNED_VARIANT="rtx50"
GPU_TUNED_PLATFORM="x86_64"
GPU_TUNED_TORCH_ARCH="12.0a"
GPU_TUNED_HW_LABEL="RTX 5080/5090 (Blackwell consumer, SM 120)"

# KleidiAI is gated off entirely on x86_64 already -- nothing to set here.
GPU_TUNED_USE_KLEIDIAI_SME=""
