# tuned/devices/rtx40.conf — static device config for RTX 40 (Ada Lovelace,
# x86_64). Ada Lovelace has no "a" (family-specific) SASS variant -- unlike
# Blackwell, there's nothing beyond the compatible/generic sm_89 target to
# opt into (see tuned/devices/rtx50.conf for the contrast).

GPU_TUNED_VARIANT="rtx40"
GPU_TUNED_PLATFORM="x86_64"
GPU_TUNED_TORCH_ARCH="8.9"
GPU_TUNED_HW_LABEL="RTX 4080/4090 (Ada Lovelace, SM 89)"

# KleidiAI is gated off entirely on x86_64 already -- nothing to set here.
GPU_TUNED_USE_KLEIDIAI_SME=""
